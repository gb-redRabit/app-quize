name: keepalive

# Utrzymuje backend na Render Free ciepły (usypia po 15 min bezruchu).
# Uwaga: zużywa ~730 h z 750 h darmowych godzin miesięcznie.
# W publicznym repo Actions są darmowe; po zmianie repo na private
# lepiej użyć cron-job.org / UptimeRobot.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS --retry 2 --max-time 90 https://app-quize.onrender.com/api/health
